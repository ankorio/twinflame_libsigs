[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twinflame-libsigs"
version = "0.2.0b1"
description = "Known-library signature store for twinflame (offline builder + mmap query reader)"
readme = "README.md"
requires-python = ">=3.11"
# Depends on twinflame for signature *content* (compute_signature + the
# SIGNATURE_STAMP the store is validated against). The query reader itself uses
# only the stdlib (mmap/struct) so it stays light on the diff hot path.
dependencies = [
    # 0.3.0b1 is the first twinflame with the --libsigs integration and the
    # SIGNATURE_STAMP this store's packs are validated against.
    "twinflame>=0.3.0b1",
]

[project.optional-dependencies]
# Offline builder only: Maven/gmaven scraping + d8 to turn .aar/.jar into DEX.
# Never pulled in by the query path or by twinflame core.
build = [
    "requests",
]
test = [
    "pytest",
]

[project.scripts]
twinflame-libsigs = "twinflame_libsigs.cli:main"

[project.urls]
Homepage = "https://github.com/ankorio/twinflame_libsigs"
twinflame = "https://github.com/ankorio/twinflame"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
