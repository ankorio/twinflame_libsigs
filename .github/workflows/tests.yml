name: tests

# Runs on every pull request (the gate before merging to master) and is reusable
# by release.yml via workflow_call so master is tested with the exact same matrix.
# Pure-Python: the native tfls_mih accelerator is optional (detect.py falls back
# to a brute-force store), so CI needs neither Rust nor d8.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package + test extras
        # twinflame>=0.3.0b1 is a prerelease; the specifier names it explicitly,
        # so pip resolves it without needing --pre.
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run tests
        run: pytest -q
