[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "tfls-mih"
version = "0.0.1"
description = "Native multi-index Hamming store for twinflame library signatures"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
features = ["python"]
# The compiled module is `tfls_mih` (matches the #[pymodule] fn name).
module-name = "tfls_mih"
