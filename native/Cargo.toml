[package]
name = "twinflame_libsigs_native"
version = "0.0.1"
edition = "2021"
description = "Native multi-index Hamming store for twinflame library signatures"

[lib]
name = "tfls_mih"
path = "src/lib.rs"
# rlib for the tests/bench; cdylib for the Python extension module.
crate-type = ["rlib", "cdylib"]

# Core is std-only (compiles offline). The Python binding is opt-in behind the
# `python` feature so `cargo test` / the bench never need pyo3.
[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[features]
python = ["dep:pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
